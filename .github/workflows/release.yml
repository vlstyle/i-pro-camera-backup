name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/i-pro-camera-backup/Chart.yaml)"
          test "${app_version}" = "${GITHUB_REF_NAME#v}"
      - run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="i-pro-camera-backup_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir "dist/${name}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "dist/${name}/i-pro-camera-backup" ./cmd/i-pro-camera-backup
            cp LICENSE README.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -r "dist/${name}"
          done
          (cd dist && sha256sum * > checksums.txt)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
