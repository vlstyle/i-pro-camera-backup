name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: docker build -t i-pro-camera-backup .

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint charts/i-pro-camera-backup -f charts/i-pro-camera-backup/ci/test-values.yaml
      - run: helm template camera-backup charts/i-pro-camera-backup -f charts/i-pro-camera-backup/ci/test-values.yaml > /dev/null
      - run: |
          app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/i-pro-camera-backup/Chart.yaml)"
          helm template camera-backup charts/i-pro-camera-backup -f charts/i-pro-camera-backup/ci/test-values.yaml | grep -q "i-pro-camera-backup:${app_version}\""
      - run: helm template camera-backup charts/i-pro-camera-backup -f charts/i-pro-camera-backup/ci/test-values.yaml --set image.tag=sha-0000000 | grep -q 'i-pro-camera-backup:sha-0000000"'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
